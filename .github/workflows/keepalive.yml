name: Keep Render awake

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping aplikasi
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 "https://learning-pang.onrender.com/")
          echo "Status HTTP: $code"
